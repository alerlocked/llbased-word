[pytest]
# E2E Test Configuration for Process Document System
testpaths = tests/e2e
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async mode for pytest-asyncio
asyncio_mode = auto

# Markers
markers =
    asyncio: mark test as async
    integration: integration tests
    e2e: end-to-end tests
    slow: slow tests

# Output settings
addopts =
    -v
    --tb=short
    --strict-markers
    -ra

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Coverage (when using pytest-cov)
# Run with: pytest --cov=backend/app --cov-report=html --cov-report=term
